name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses and install API 36.1
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle toolchain
        run: gradle --version

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Signed Release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          gradle :app:assembleRelease --no-daemon --stacktrace
          rm -f my-upload-key.jks
          cp app/build/outputs/apk/release/app-release.apk MasjidMap-release.apk
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs MasjidMap-release.apk
          sha256sum MasjidMap-release.apk > MasjidMap-release.apk.sha256

      - name: Publish Release APK to GitHub Releases tab
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Masjid Map ${TAG_NAME}"
            VERSIONED_APK="MasjidMap-${TAG_NAME}.apk"
            cp MasjidMap-release.apk "$VERSIONED_APK"
            sha256sum "$VERSIONED_APK" > "${VERSIONED_APK}.sha256"
            gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$RELEASE_TITLE" --notes "Signed Release APK for Masjid Map (${TAG_NAME})."
            gh release upload "$TAG_NAME" "$VERSIONED_APK" "${VERSIONED_APK}.sha256" --clobber
          else
            TAG_NAME="latest"
            RELEASE_TITLE="Masjid Map · Latest Release"
            NOTES="Automatically built signed Release APK from commit ${GITHUB_SHA::7}."
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release edit "$TAG_NAME" --tag "$TAG_NAME" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$NOTES"
            else
              gh release create "$TAG_NAME" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$NOTES"
            fi
            gh release upload "$TAG_NAME" MasjidMap-release.apk MasjidMap-release.apk.sha256 --clobber
          fi
